<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — CyberHX CTF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; margin: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  min-height: 100vh; background: #060b10; color: #e1e7ec;
  font: 15px/1.65 "Inter", ui-sans-serif, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 2rem 1.25rem;
  overflow: hidden;
}
.mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace; font-variant-ligatures: none; }

.grid-bg {
  position: fixed; inset: 0; z-index: 0;
  background-image:
    linear-gradient(rgba(198,255,0,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(198,255,0,.03) 1px, transparent 1px);
  background-size: 40px 40px;
  mask-image: radial-gradient(ellipse 60% 50% at 50% 50%, #000 20%, transparent 70%);
  -webkit-mask-image: radial-gradient(ellipse 60% 50% at 50% 50%, #000 20%, transparent 70%);
}

.scanline {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background: repeating-linear-gradient(transparent, transparent 2px, rgba(0,0,0,.06) 2px, rgba(0,0,0,.06) 4px);
}

.wrap { position: relative; z-index: 2; text-align: center; max-width: 32rem; }

.code {
  font: 700 7rem/1 "JetBrains Mono", monospace;
  letter-spacing: -.04em;
  background: linear-gradient(180deg, #c6ff00 0%, #7a9e00 100%);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  text-shadow: none;
  filter: drop-shadow(0 0 40px rgba(198,255,0,.25));
  margin-bottom: .5rem;
}

.glitch { position: relative; }
.glitch::before, .glitch::after {
  content: "404"; position: absolute; inset: 0;
  background: linear-gradient(180deg, #c6ff00 0%, #7a9e00 100%);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.glitch::before { animation: glitch-1 3s infinite linear; clip-path: inset(20% 0 60% 0); }
.glitch::after  { animation: glitch-2 3s infinite linear; clip-path: inset(60% 0 10% 0); }

@keyframes glitch-1 {
  0%, 92%  { transform: translate(0); }
  93%      { transform: translate(-4px, 1px); }
  94%      { transform: translate(3px, -1px); }
  95%      { transform: translate(-2px, 0); }
  96%, 100%{ transform: translate(0); }
}
@keyframes glitch-2 {
  0%, 94%  { transform: translate(0); }
  95%      { transform: translate(3px, 1px); }
  96%      { transform: translate(-4px, -1px); }
  97%      { transform: translate(2px, 0); }
  98%, 100%{ transform: translate(0); }
}

.tag {
  display: inline-block;
  font: 700 .625rem/1 "JetBrains Mono", monospace;
  letter-spacing: .18em; text-transform: uppercase;
  color: #c6ff00;
  padding: .35rem .65rem;
  border: 1px solid rgba(198,255,0,.38);
  background: rgba(198,255,0,.08);
  border-radius: 999px;
  margin-bottom: 1.25rem;
}

h1 {
  font-size: 1.5rem; font-weight: 700; letter-spacing: -.02em;
  margin-bottom: .5rem;
}

.sub { color: #8a949d; margin-bottom: 2rem; font-size: .9375rem; }

.terminal {
  background: #0d161f; border: 1px solid #1a242d; border-radius: 14px;
  padding: 1.25rem 1.5rem; text-align: left;
  box-shadow: 0 2px 6px -1px rgba(2,6,11,.6), 0 1px 2px rgba(2,6,11,.5);
  margin-bottom: 2rem;
  font-family: "JetBrains Mono", ui-monospace, monospace; font-size: .8125rem;
  line-height: 1.7; color: #667381;
}
.terminal .prompt { color: #c6ff00; }
.terminal .err { color: #e0705f; }
.terminal .ok  { color: #5eead4; }

.btn {
  display: inline-flex; align-items: center; gap: .5rem;
  height: 2.75rem; padding: 0 1.5rem; border-radius: 10px; border: none; cursor: pointer;
  font: 700 .75rem/1 "Inter", sans-serif; letter-spacing: .12em; text-transform: uppercase;
  text-decoration: none; white-space: nowrap; transition: transform .15s, box-shadow .15s;
}
.btn-primary {
  color: #0a1000;
  background: linear-gradient(180deg, #ddff6b 0%, #c6ff00 52%, #b2e600 100%);
  box-shadow: 0 2px 6px -1px rgba(2,6,11,.6), inset 0 1px 0 rgba(255,255,255,.35), 0 6px 22px -8px rgba(198,255,0,.3);
}
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 20px -6px rgba(2,6,11,.7), 0 6px 22px -8px rgba(198,255,0,.5); }

.cursor { display: inline-block; width: 7px; height: 14px; background: #c6ff00; margin-left: 2px; animation: blink 1s step-end infinite; vertical-align: text-bottom; }
@keyframes blink { 50% { opacity: 0; } }

@media (max-width: 40rem) {
  .code { font-size: 5rem; }
  h1 { font-size: 1.25rem; }
  .terminal { padding: 1rem; font-size: .75rem; }
}
@media (prefers-reduced-motion: reduce) {
  .glitch::before, .glitch::after { animation: none; }
  .cursor { animation: none; opacity: 1; }
  .btn-primary:hover { transform: none; }
}
</style>
</head>
<body>
<div class="grid-bg" aria-hidden="true"></div>
<div class="scanline" aria-hidden="true"></div>
<div class="wrap">
  <div class="code glitch" aria-hidden="true">404</div>
  <div class="tag">access denied</div>
  <h1>This path leads nowhere</h1>
  <p class="sub">The page you're looking for doesn't exist, was moved, or you don't have clearance.</p>
  <div class="terminal" role="presentation">
    <div><span class="prompt">$</span> curl -s ctf.cyberhx.com<span id="path"></span></div>
    <div><span class="err">Error:</span> route not found in target scope</div>
    <div><span class="prompt">$</span> cd /home<span class="cursor"></span></div>
  </div>
  <a class="btn btn-primary" href="/">Return to Base</a>
</div>
<script>
try { document.getElementById('path').textContent = location.pathname; } catch(e) {}
</script>
</body>
</html>
